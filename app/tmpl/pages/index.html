{{ define "index.html" }}
<!DOCTYPE html>
<html>
<head>
<title>InTime</title>
<script src="/static/htmx.min.js"></script>
<script src="/static/ws.min.js"></script>
<script src="/static/tailwind.js"></script>
<script src="/static/chart-4.5.1.js"></script>
<!-- <script src="/static/materialize.min.js"></script> -->
<!-- <script src="/static/bootstrap.min.js"></script> -->
<!-- <link rel="stylesheet" href="static/pico.jade.min.css"> -->
<link rel="stylesheet" href="static/style.css">
<!-- <link rel="stylesheet" href="static/materialize.min.css"> -->
<!-- <link rel="stylesheet" href="static/bootstrap.min.css"> -->
</head>
<body>

<div id="page">  
  <div id="sidebar" class="bg-primary" style="border-right: solid var(--color-border) 1px">
    <p class="bg-tertiary-hover border-gray-500 border text-white">TE Mode</p>
    <p class="bg-tertiary-hover border-gray-500 border text-white">Packet Mode</p>
  </div>
  <div id="main">
    <h1>InTime - Time Error Mode</h1>

    <form id="config-form">
      {{ template "config" . }}

      <hr style="color: var(--color-border)">
      
      <div style="padding-top: 10px">
	<button type="submit"
		id="start-capture-button"
		name="action"
		value="start-and-capture"
		class="bg-quat bg-quat-hover color-text rounded py-2 px-4" 
		onclick="start_stop(true, true)"
		hx-post="/te-toggle"
		hx-swap="innerHTML"
		hx-target="#msgs">
	  Start-and-capture
	</button>

	<button type="submit"
		id="start-button"
		name="action"
		value="start"
		class="bg-quat bg-quat-hover color-text rounded py-2 px-4" 
		onclick="start_stop(true, false)"
		hx-post="/te-toggle"
		hx-swap="innerHTML"
		hx-target="#msgs">
	  Start
	</button>

	<button type="submit"
		id="record-button"
		name="action"
		value="record"
		onclick="record()"
		class="bg-quat bg-quat-hover color-text rounded py-2 px-4" 
		disabled
		hx-post="/te-toggle"
		hx-swap="none">
	  Capture
	</button>

	<button type="submit"
		id="stop-button"
		name="action"
		value="stop"
		onclick="start_stop(false, false)"
		class="bg-quat bg-quat-hover color-text rounded py-2 px-4" 
		disabled
		hx-post="/te-toggle"
		hx-swap="innerHTML"
		hx-target="#results">
	  Stop
	</button>
      </div>
    </form>

    <!-- <form hx-post="/te-toggle" hx-swap="none"> -->
      <!-- <button type="submit" name="action" value="stop" class="bg-gray-700 hover:bg-gray-500 text-white rounded py-2 px-4">Stop</button> -->
    <!-- </form> -->


    <div hx-ext="ws" ws-connect="/ws" style="padding-left: 20px; padding-right: 20px">
      <div id="table-container">
	<table class="table-fixed">
          <thead>
            <tr>
	      <th style="width: 5%">Port</th>
	      <th style="width: 2%">Dir</th>
	      <th style="width: 10%">Type</th>
	      <th style="width: 5%">Domain</th>
	      <th style="width: 5%">Seq</th>
	      <th style="width: 13%">Correction</th>
	      <th style="width: 13%">OriginTS</th>
	      <th style="width: 13%">Timestamp</th>
	      <!-- <th></th> -->
            </tr>
          </thead>
          <tbody id="msgs">
          </tbody>
	</table>
      </div>
    </div>
    
    <div id="results" class="color-text" style="padding-left: 20px; padding-top: 20px;">
    </div>

  </div>
</div>

</body>


<script>
function start_stop(is_start, is_capture) {
	const start = document.getElementById("start-button")
	const start_cap = document.getElementById("start-capture-button")
	const stop = document.getElementById("stop-button")
	const record = document.getElementById("record-button")
	
	if (is_start) {
		start.setAttribute("disabled", "")
		start_cap.setAttribute("disabled", "")
		stop.removeAttribute('disabled');
		if (!is_capture)
			record.removeAttribute('disabled');
	} else {
		stop.setAttribute("disabled", "")
		record.setAttribute("disabled", "")
		start.removeAttribute('disabled');
		start_cap.removeAttribute('disabled');
	}
}
function record() {
	const record = document.getElementById("record-button")
	record.setAttribute("disabled", "")
}
</script>




</html>

{{ end }}
